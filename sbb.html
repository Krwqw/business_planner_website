<style>
    .completed {
        text-decoration: line-through; /* Зачёркивает текст */
    }

    input[type="checkbox"]:checked:before {
 border-color: #b64881;  
 background-color: #ECEABE; 
 background-size: 100%; 
 background-repeat: no-repeat;
 background-position: center;
}
input[type="checkbox"]:before {
    content: "";
    display: inline-block;
    width: 12px; /* ширина */
    height: 12px; /* высота */
    background-color: #b64881; /* цвет фона */
    border: 1px solid #f3cdcd; /* ширина и цвет рамки */
    /* border-radius: 6px; скругление углов */
}
</style>
<script>
    function addTask() {
        const taskInput = document.getElementById('taskInput'); /*Возвращает ссылку на элемент по его идентификатору (ID); 
                                                                идентификатор является строкой, которая может быть использована для идентификации элемента*/
        const taskText = taskInput.value;
        if (taskText.trim() === '') return;
        const taskList = document.getElementById('taskList');
        const taskItem = document.createElement('div');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.onclick = function() {
            taskTextSpan.classList.toggle('completed', checkbox.checked);
        };
        const taskTextSpan = document.createElement('span');
        taskTextSpan.textContent = taskText;
        taskItem.appendChild(checkbox);
        taskItem.appendChild(taskTextSpan);
        taskList.appendChild(taskItem);

        taskInput.value = ''; // очищает поле ввода
    }
</script>
